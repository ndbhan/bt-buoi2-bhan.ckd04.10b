<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
    <style>
        h1 {
            color: forestgreen;
            font-size: 30px;
        }

        h3 {
            color: brown;
            font-size: 20px;
        }

        .mua {
            color: blue;
            font-size: 16px;
        }

        .doanvan {
            color: blue;
            font-size: 16px;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>Mùa Xuân Nho Nhỏ</h1>

    <h3>Trái tim cho em</h3>

    <p class="mua">
        Xuân Hạ Thu Đông
    </p>

    <p class="doanvan">
        <span class="highlight">Câu chuyện của mùa Đông.</span>
        Nếu là hoa tôi sẽ là hoa Hướng Dương
        <span class="highlight">
            Nếu là Người tôi sẽ chết cho quê hương
        </span>
    </p>
</body>
</html>
