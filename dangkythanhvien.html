<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table width="600" border="2" cellspacing="0" align="center">

    <tr>
        <td align="center" height="90">
            <h2>ĐĂNG KÝ THÀNH VIÊN</h2>
        </td>
    </tr>

    <tr>
        <td>

            <form action="#" name="dangky">

                <fieldset>

                    <legend><b>Thông tin cá nhân</b></legend>

                    <table cellspacing="5">

                        <tr>
                            <td>Họ và tên:</td>
                            <td>
                                <input type="text" name="hoten"
                                style="width:280px;">
                            </td>
                        </tr>

                        <tr>
                            <td>Ngày sinh:</td>

                            <td>

                                <select name="ngay">
                                    <option>01</option>
                                    <option>02</option>
                                    <option>03</option>
                                    <option>04</option>
                                    <option>05</option>
                                    <option>06</option>
                                    <option>07</option>
                                    <option>08</option>
                                    <option>09</option>
                                    <option>10</option>
                                    <option>11</option>
                                    <option>12</option>
                                    <option>13</option>
                                    <option>14</option>
                                    <option>15</option>
                                    <option>16</option>
                                    <option>17</option>
                                    <option>18</option>
                                    <option>19</option>
                                    <option>20</option>
                                    <option>21</option>
                                    <option>22</option>
                                    <option>23</option>
                                    <option>24</option>
                                    <option>25</option>
                                    <option>26</option>
                                    <option>27</option>
                                    <option>28</option>
                                    <option>29</option>
                                    <option>30</option>
                                    <option>31</option>
                                </select>

                                Tháng

                                <select name="thang">
                                    <option>01</option>
                                    <option>02</option>
                                    <option>03</option>
                                    <option>04</option>
                                    <option>05</option>
                                    <option>06</option>
                                    <option>07</option>
                                    <option>08</option>
                                    <option>09</option>
                                    <option>10</option>
                                    <option>11</option>
                                    <option>12</option>
                                </select>

                                Năm

                                <input type="text" name="nam"
                                style="width:90px;">

                            </td>
                        </tr>

                        <tr>
                            <td>Giới tính:</td>

                            <td>
                                <input type="radio" name="gioitinh"
                                value="Nam" checked> Nam

                                <input type="radio" name="gioitinh"
                                value="Nữ"> Nữ
                            </td>
                        </tr>

                        <tr>
                            <td>Địa chỉ:</td>

                            <td>
                                <textarea name="diachi"
                                rows="4" cols="32"></textarea>
                            </td>
                        </tr>

                        <tr>
                            <td>Điện thoại:</td>

                            <td>
                                <input type="text" name="dienthoai"
                                style="width:200px;">
                            </td>
                        </tr>

                        <tr>
                            <td>Email:</td>

                            <td>
                                <input type="email" name="email"
                                style="width:200px;" required>
                            </td>
                        </tr>

                    </table>

                </fieldset>

                <br>

                <fieldset>

                    <legend><b>Thông tin đăng nhập</b></legend>

                    <table cellspacing="5">

                        <tr>
                            <td>Tên đăng nhập:</td>

                            <td>
                                <input type="text" name="tendangnhap"
                                style="width:200px;" required>
                            </td>
                        </tr>

                        <tr>
                            <td>Mật khẩu:</td>

                            <td>
                                <input type="password" name="matkhau"
                                style="width:200px;" required>
                            </td>
                        </tr>

                        <tr>
                            <td>Nhập lại mật khẩu:</td>

                            <td>
                                <input type="password"
                                name="nhaplaimatkhau"
                                style="width:200px;" required>
                            </td>
                        </tr>

                    </table>

                </fieldset>

                <br>

                <center>

                    <input type="submit" value="Đăng ký">

                    <input type="reset" value="Hủy">

                </center>

                <br>

            </form>

        </td>
    </tr>

</table>

<script>

document.forms["dangky"].onsubmit = function() {

    var mk = document.forms["dangky"]["matkhau"].value;

    var nhaplaimk = document.forms["dangky"]["nhaplaimatkhau"].value;

    if (mk == "" || nhaplaimk == "") {
        alert("Vui lòng nhập đầy đủ mật khẩu!");
        return false;
    }

    if (mk != nhaplaimk) {
        alert("Mật khẩu nhập lại không khớp!");
        return false;
    }

    return true;

};

</script>
</body>
</html>
